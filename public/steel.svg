<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640">
  <!-- Шлифованная нержавейка: вытянутый по горизонтали шум (риски от шлифовки) -->
  <filter id="brush" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.0025 0.55" numOctaves="4" seed="11" stitchTiles="stitch" result="noise"/>
    <feColorMatrix in="noise" type="matrix"
      values="0.33 0.33 0.33 0 0
              0.33 0.33 0.33 0 0
              0.33 0.33 0.33 0 0
              0    0    0    0 1" result="grey"/>
    <feComponentTransfer in="grey">
      <feFuncR type="linear" slope="1.25" intercept="0.04"/>
      <feFuncG type="linear" slope="1.25" intercept="0.05"/>
      <feFuncB type="linear" slope="1.25" intercept="0.07"/>
    </feComponentTransfer>
  </filter>
  <rect width="640" height="640" filter="url(#brush)"/>
</svg>
