<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Переписка в читабельном виде</title>
  <meta name="description" content="Разбор e-mail переписки из буфера обмена и параллельный перевод на русский язык">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1>Переписка в читабельном виде</h1>
    <p class="sub">Скопируйте цепочку писем (Ctrl+A, Ctrl+C в почтовом клиенте) и нажмите кнопку ниже — или перетащите письмо из Outlook в поле ниже.</p>
  </header>

  <main>
    <section class="input-card">
      <div class="actions">
        <button id="pasteBtn" class="primary" type="button">Вставить из буфера обмена</button>
        <button id="last2Btn" type="button">Перевести только 2 последних письма</button>
        <button id="copyBtn" type="button" disabled>Копировать результат</button>
      </div>
      <div id="dropZone" class="dropzone" role="button" tabindex="0" aria-label="Перетащите письмо из Outlook сюда или нажмите, чтобы выбрать файл">
        <strong>Перетащите письмо из Outlook сюда</strong>
        <span>или нажмите, чтобы выбрать файл .msg / .eml — письмо будет сразу переведено</span>
        <input id="fileInput" type="file" accept=".msg,.eml,.txt,.htm,.html,message/rfc822" multiple hidden>
      </div>
      <label class="option"><input type="checkbox" id="stripSig" checked> Убирать подписи в конце писем</label>
      <details id="sourceBox">
        <summary>Исходный текст</summary>
        <textarea id="source" spellcheck="false" placeholder="Сюда можно вставить текст переписки вручную (Ctrl+V)…"></textarea>
      </details>
      <div id="status" class="status" role="status" aria-live="polite"></div>
      <div id="legend" class="legend"></div>
    </section>

    <section id="result" class="result" hidden></section>
  </main>

  <script src="parser.js"></script>
  <script src="translate-core.js"></script>
  <script src="mailfile.js"></script>
  <script src="app.js"></script>
</body>
</html>
